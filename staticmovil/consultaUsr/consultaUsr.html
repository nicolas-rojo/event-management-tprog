<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ediciones :: Mis Eventos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

<body>
	<!-- Topbar -->
	<nav class="top-nav">
  		<div class="container-fluid">
    		<div class="top-nav-content">
      			<!-- Botón Atrás -->
      			<button onclick="history.back()" class="back-button">
        			<i class="bi bi-arrow-left"></i>
      			</button>
      
      			<!-- Logo -->
      			<a href="../listarEventos/listarEventos.html" class="logo">
        			<img src="../src/images/logo.png" alt="Logo">
				</a>
    		</div>
  		</div>
	</nav>

    <!-- Cards -->
	<div class="info-container">
		<!-- Card Usuario -->
		<div class="profile-card">

      				<img src="../src/images/IMG-US01.jpg" alt="Usuario">

    			<p class="profile-nickname">nickname</p>

    <nav class="bottom-nav">

        	<div class="bottom-nav-content">
				<!-- Botón Home -->

				<a href="../consultaUsr/consultaUsr.html" class="nav-item profile-link">

        	</div>
      </div>
