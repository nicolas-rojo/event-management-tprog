<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Mis Eventos</title>

	<!-- Fuente -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- Barra superior -->
	<div class="topbar">
		<div class="topbar-logo">
			<img src="../src/images/logo.png">
		</div>

		<div class="topbar-search">
			<input type="text" placeholder="Buscar evento, edicion... 🔍">
		</div>

		<div class="topbar-right">
			<a href="../login/login.html">Ingresar</a>
			<a href="#">Registrarse</a>
		</div>
	</div>

	<!-- Barra lateral -->
	<div class="sidebar">
		<button class="botonessidebar" type="submit">Consultar Evento</button>
		<button class="botonessidebar" type="submit">Consultar Usuario</button>
	</div>

	<!-- Contenido -->
	<div class="content">
		<div class="contenedores">
			<div class="contenedor" alt="Maraton Montevideo">
				<img class="imagenes" src="../src/images/maraton.jpg" width="120px" height="120px">
				<div class="informacion">
					<h2>Maratón de Montevideo</h2>
					<p>Competencia deportiva anual en la capital.</p>
				</div>
			</div>

			<div class="contenedor" alt="Montevideo Rock">
				<img class="imagenes" src="../src/images/mrock.png" width="120px" height="120px">
				<div class="informacion">
					<h2>Montevideo Rock</h2>
					<p>Festival de rock con artistas nacionales e internacionales.</p>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
