<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mis Eventos</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../componentes/style.css">
</head>

<body>
    <!-- Cargamos la topbar y el sidebar -->
    <div id="topbar"></div>
    <div id="sidebar"></div>

    <!-- Contenido -->
    <div class="content">
        <div class="columna-izquierda"></div>
        <div class="columna-central">
            <div class="contenedor-principal">
                <img class="imagenes" src="../src/images/IMG-EDEV04.jpeg" width="150px" height="150px">
                <div class="informacion-evento">
                    <h2 class="nombre-evento" id="nombreMaraton">Maratón de Montevideo 2022</h2>
                    <div class="detalles-evento">
                        <span class="pais">Montevideo, Uruguay</span>
                        <span class="fechas">Desde: 14/09/2022 - Hasta: 14/09/2022</span>
                        <span class="fecha-alta">Alta: 21/05/2022</span>
                        <span class="siglas">Sigla: MARATON22</span>
                    </div>
                </div>
            </div>

        </div>
        <div class="columna-derecha">
            <h2 class="texto-og">Organiza:</p>
                <div class="contenedor-derecha">
                    <img class="imagenes" src="" alt="logoOrg" width="120px" height="120px">
                    <div class="informacion-TRegistro">
                        <h2 class="nombre-og">Intendencia de Montevideo</h2>
                        <div class="detalles-TRegistro">
                            <span class="email-org">contacto@imm.gub.uy</span>
                        </div>
                    </div>
                </div>
                <h2 class="texto-registro" id="tr" style="display: none;">Registro:</p>
                    <div class="contenedor-derecha-alt" id="registro" style="display: none;">
                        <div class="informacion-TRegistro">
                            <h2 class="nombre-og"></h2>
                            <div class="detalles-TRegistro">
                                <span class="dato-registro"></span>
                                <span class="dato-registro"></span>
                            </div>
                        </div>
                    </div>
                    <h2 class="texto-registro" id="tlr" style="display: none;">Listado de registros: </p>
                        <div class="contenedor-derecha-alt" id="listado-registros" style="display: none;">
                            <div class="informacion-TRegistro">
                                <div class="detalles-TRegistro">
                                    <div class="registro-item"> Sin registros actualmente.</div>
                                    <div class="registro-item"></div>
                                    <div class="registro-item"></div>
                                    <div class="registro-item"></div>
                                </div>
                            </div>
                        </div>
        </div>
    </div>
    <script src="../componentes/cargarComponentes.js"></script>
    <script src="botonInscripcion.js"></script>
    <script src="mostrarListado.js"></script>
    <script src="mostrarRegistro.js"></script>
</body>

</html>

<!-- no tiene registrados. Se muestra el listado de registros 
 y estara vacio para el organizador. -->
