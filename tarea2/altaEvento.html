<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: outfit;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        .logo {
            width: 150px;
            position: fixed;      
            top: 15px;            
            left: 15px;          
        }

        input, button, textarea, select {
            font-family: outfit;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        textarea {
            height: 100px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <img src="img/logo.png" alt="logo" class="logo">
    <div class="login-container">
        <h2>Nuevo Evento</h2>
        <form>
            <input type="text" id="nombreEv" placeholder="Nombre" required>
            <textarea id="desc" id="desc" placeholder="Descripción" required></textarea>
            <input type="text" id="sigla" placeholder="Siglas" required>
            <div class="form-group">
                <label for="categorias">Categorías:</label>
                <select id="categorias" name="categorias[]" multiple>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Innovación">Innovación</option>
                    <option value="Literatura">Literatura</option>
                    <option value="Cultura">Cultura</option>
                    <option value="Música">Música</option>
                    <option value="Deporte">Deporte</option>
                    <option value="Salud">Salud</option>
                    <option value="Entretenimiento">Entretenimiento</option>
                    <option value="Agro">Agro</option>
                    <option value="Negocios">Negocios</option>
                    <option value="Moda">Moda</option>
                    <option value="Investigación">Investigación</option>
                </select>
            </div>
            <input type="file" id="imagen" name="imagen" accept="image/*">
            <div class="button-group">
                <button type="submit">Aceptar</button>
                <button type="button">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
