<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Evento</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="../index/index.html">
        <img src="../../src/images/logo.png" alt="logo" class="logo">
    </a>
    <div class="login-container">
        <h2>Nuevo Tipo de Registro</h2>
        <form id="formTReg">
            <input type="text" id="nombreTReg" placeholder="Nombre" required>
            <textarea id="desc" placeholder="Descripción" required></textarea>
            <input type="number" id="costo" placeholder="Costo" min="0" step="0.01" required>
            <input type="number" id="cupo" placeholder="Cupo" min="1" required>
            <div class="button-group">
                <button type="button">Aceptar</button>
                <button type="button" id="cancelarBtn" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>
</body>

</html>
