<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Evento</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
     <a href="../index/index.html">
        <img src="../src/images/logo.png" alt="logo" class="logo">
	</a>
    <div class="login-container">
        <h2>Nuevo Patrocinio</h2>
        <form id="formPatrocinio">
            <div class="form-group">
                <label for="treg">Tipo de Registro:</label>
                <select id="treg" name="treg" required>
                    <!-- Aca se cargarían los tipos de registro para la edicion seleccionada -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="ins">Institución:</label>
                <select id="ins" name="ins" required>
                    <!-- Aca se cargarían todas las instituciones existentes -->
                </select>
            </div>

            <div class="form-group">
                <label for="nivel">Nivel de Patrocinio:</label>
                <select id="nivel" name="nivel" required>
                    <option value="Platino">Platino</option>
                    <option value="Oro">Oro</option>
                    <option value="Plata">Plata</option>
                    <option value="Bronce">Bronce</option>
                </select>
            </div>
            
            <input type="number" id="aporte" placeholder="Aporte Economico" min="0" required>
            <input type="number" id="ctdReg" placeholder="Cantidad de Registros" min="0" required>
            <input type="text" id="cod" placeholder="Código" required>
            <div class="button-group">
                <button type="submit">Aceptar</button>
                <button type="button" id="cancelarBtn">Cancelar</button>
            </div>
        </form>
    </div>
</body>

</html>
