<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Mis Eventos</title>
  <style>
    body {
      margin: 0;
      font-family: outfit;
    }

    /* Barra superior */
    .topbar {
        display: flex;
        box-sizing: border-box;
        align-items: center;
        justify-content: space-between;
        background-color: #333;
        color: #f1eeee;
        position: fixed;
        width: 100%;
        padding: 10px 20px;
    }

    .topbar img {
      height: 40px;
    }
    .search-bar {
        width: 700px;
        display: flex;
        justify-content: center;
        align-self: center;

    }

    .search-bar input {
      width: 35%;
      padding: 8px;
      border-radius: 20px;
      border: none;
      outline: none;
    }


    .topbar-right a {
      margin-left: 15px;
      text-decoration: none;
      color: #f1eeee;
      font-weight: bold;
    }

    .topbar-right a:hover {
      text-decoration: underline;
    }

    /* Barra lateral */
    .sidebar {
      position: fixed;
      top: 60px; /* altura aprox. de la barra superior */
      width: 260px;
      height: 100vh;
      background-color: #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      gap: 20px;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: #f1eeee;
      text-decoration: none;
    }

    .sidebar a:hover {
      background-color: #555;
    }

    /* Contenido principal */
    .content {
      display: flex;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      padding: 20px;
      height: 100vh;
      justify-content: center;
    }

    .contenedores{
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 60px;
    }

    .contenedor{
        background-color: #f1eeee;
        width: 600px;
        height: 160px;
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        border-top-right-radius: 30px;
        border-top-left-radius: 30px;
        box-shadow:  0px 8px 20px rgba(0,0,0,0.2);
        display: flex;
        justify-content: left;
        align-items: center;
        padding-left: 20px;
        flex-direction: row;
        gap: 20px;
    }

    .imagenes{
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        border-top-right-radius: 30px;
        border-top-left-radius: 30px;
    }

    .informacion{
        height: 120px;
        flex-direction: column;
    }

    .botonessidebar {
        background: #f1eeee;
        border: none;
        color: rgb(0, 0, 0);
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 180px;
        height: 60px;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .botonessidebar:hover {
        opacity: 0.9;
    }

  </style>
</head>
<body>
  <!-- Barra superior -->
  <div class="topbar">
    <img src="/img/logo.png" width="110" height="50">

    <div class="search-bar">
      <input type="text" placeholder="Buscar evento, edicion... 🔍">
    </div>

    <div class="topbar-right">
      <a href="#">Ingresar</a>
      <a href="#">Registrarse</a>
    </div>
  </div>
  

  <!-- Barra lateral -->
  <div class="sidebar">
    <button class="botonessidebar" type="submit">Consultar Evento</button>
    <button class="botonessidebar" type="submit">Consultar Usuario</button>

  </div>

  <!-- Contenido -->
  <div class="content">
    <div class="contenedores">
        <div class="contenedor" alt="Maraton Montevideo">
            <img class="imagenes" src="/img/maraton.jpg" width="120px" height="120px">
            <div class="informacion">
                <h2>Maraton de Montevideo</h2>
                <p>Competencia deportiva anual en la capital.</p>
            </div>
        </div>
        <div class="contenedor" alt="Montevideo Rock">
          <img class="imagenes" src="/img/mrock.png" width="120px" height="120px">
        <div class="informacion">
          <h2>Montevideo Rock</h2>
          <p>Festival de rock con artistas nacionales e internacionales.</p>
        </div>

        </div>
        <div class="contenedor"></div>   
    </div>
  </div>
</body>
</html>
