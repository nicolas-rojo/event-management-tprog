<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Usuarios</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="stylePrueba.css">
    <link rel="stylesheet" href="../componentes/style.css">
</head>

<body>
    <!-- Cargamos la topbar y el sidebar -->
    <div id="topbar"></div>
    <div id="sidebar"></div>

    <!-- Contenido -->
    <div class="content">
        <div class="contenedores">
            <h1 class="seccion-titulo">Usuarios Registrados</h1>

            <!-- Filtros opcionales -->
            <div class="filtros">
                <button class="filtro-btn active" data-filtro="todos">Todos</button>
                <button class="filtro-btn" data-filtro="asistente">Asistentes</button>
                <button class="filtro-btn" data-filtro="organizador">Organizadores</button>
            </div>

            <div class="contenedor-usuarios" id="contenedor-usuarios">
                <!-- Los usuarios se cargarán dinámicamente -->
            </div>
        </div>
    </div>

    <script src="../componentes/cargarComponentes.js"></script>
    <script src="script.js"></script>
</body>

</html>
