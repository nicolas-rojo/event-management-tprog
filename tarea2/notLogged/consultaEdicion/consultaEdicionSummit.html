<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mis Eventos</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../componentes/style.css">
</head>

<body>
    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-logo">
            <a href="../../notLogged/index/index.html">
                <img src="../../src/images/logo.png">
            </a>
        </div>

        <div class="topbar-search">
            <input type="text" placeholder="Buscar evento, edicion... 🔍">
        </div>

        <div class="topbar-right">
            <a href="../login/loginEdSumm.html">Ingresar</a>
            <a href="../register/register.html">Registrarse</a>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <a href="../../notLogged/index/index.html" class="element">Consultar Evento</a>
        <a href="../consultaUsuario/consultaUsuario.html" class="element">Consultar Usuario</a>
    </div>

    <!-- Contenido -->
    <div class="content">
        <div class="columna-izquierda"></div>

        <div class="columna-central">
            <div class="contenedor-principal">
                <img class="imagenes" src="../../src/images/IMG-NO.png" alt="logoEdición" width="150px" height="150px">
                <div class="informacion-evento">
                    <h2 class="nombre-evento" id="nombreMaraton">Web Summit 2026</h2>
                    <div class="detalles-evento">
                        <span class="pais">Lisboa, Portugal</span>
                        <span class="fechas">Desde: 13/01/2026- Hasta: 01/02/2026</span>
                        <span class="fecha-alta">Alta: 05/02/2025</span>
                        <span class="siglas">SIG: WS26</span>
                    </div>
                </div>
            </div>

            <h2 class="texto-ed">Tipos de Registro:</p>

            <div class="contenedorTRegistros">
                <div class="contenedor">
                    <div class="informacion-TRegistro">
                        <h2 class="nombre-evento">Estudiante </h2>
                        <div class="detalles-TRegistro">
                            <span class="descripcion-TRegistro">Acceso para estudiantes.</span>
                            <span class="costo-TRegistro">Costo: $300.</span>
                            <span class="Cupos-TRegistro">0 cupos restantes.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="columna-derecha">
            <h2 class="texto-og">Organiza:</p>
            <a href="../consultaUsuario/consultaDetalleOrganizador.html" class="contenedor-link">     
            <div class="contenedor-derecha">
                <img class="imagenes" src="../../src/images/IMG-NO.png" alt="logoOrg" width="120px" height="120px">
                <div class="informacion-TRegistro">
                    <h2 class="nombre-og">Corporación Tecnológica</h2>
                    <div class="detalles-TRegistro">
                        <span class="email-org">info@techcorp.com</span>
                    </div>
                </div>
            </div>
            </a>
        </div>
    </div>
